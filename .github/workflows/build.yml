name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a mvn -B clean verify
          else
            mvn -B clean verify
          fi

      - name: No Swing leftovers
        shell: bash
        run: |
          if grep -R -nE 'javax\.swing|java\.awt' src/main/java; then
            echo "Swing/AWT references found in src/main/java"
            exit 1
          fi
          if find src -name '*.form' | grep -q .; then
            echo "NetBeans .form files found"
            exit 1
          fi

      - name: Package app image
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/package-windows.ps1
          else
            sh scripts/package-unix.sh
          fi

      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: NNPPSS-${{ matrix.os }}
          path: dist
          retention-days: 7
